<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro exemplo de Jquery</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>"
</head>
<body>
    <h1 id="#titulo">Titulo antigo</h1>
    <button id=""btn-mudar">Mudar texto</button>
    <script>
        $(document).ready(function(){
            $("#btn-mudar").click(function(){
                $("#titulo").text("texto alterado com jquery")
            })  
        })
    </script>
</body>
</html>
